{% extends 'base.html' %}

{% block titulo_pagina %}{{ titulo_pagina }}{% endblock %}
{% block titulo_cabecalho %}{{ titulo_pagina }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 col-md-offset-3">
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">{{ titulo_pagina }}</h3>
            </div>
            <form role="form" method="post">
                {% csrf_token %}
                <div class="box-body">
                    <div class="form-group">
                        {{ form.nome.label_tag }}
                        {{ form.nome }}
                    </div>
                    <div class="form-group">
                        <div class="checkbox">
                            <label>
                                {{ form.ativo }} {{ form.ativo.label }}
                            </label>
                        </div>
                    </div>
                </div>
                <div class="box-footer">
                    <button type="submit" class="btn btn-primary">
                        <i class="fa fa-save"></i> Salvar
                    </button>
                    <a href="{% url 'formas_pagamento:lista_formas_pagamento' %}" class="btn btn-default">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
